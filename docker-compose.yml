version: '3.9'

services:

  backend:
    build: ./backend
    ports:
      - "4000:4000"

    env_file:
      - ./backend/.env

    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build: ./frontend

    ports:
      - "5173:5173"

    depends_on:
      - backend

    volumes:
      - ./frontend:/app
      - /app/node_modules

  admin:
    build: ./admin

    ports:
      - "5174:5174"

    depends_on:
      - backend

    volumes:
      - ./admin:/app
      - /app/node_modules